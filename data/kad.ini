[General]
#多因子认证，需多个认证方式认证通过,And
#多路认证，多个认证方式选择一个通过即可,Or
AuthMode=Or
AuthOrder=iris,face,fingerprint,fingervein,ukey,soft face,soft code,soft code no camera
#内置最大错误次数判断，错误超过该次数后，该用户将无法使用生物认证(认证服务提供的认证方式)
#只针对与多路认证，多因子认证错误次数不由认证服务接管
MaxFailures=3
EnabledPAMServices=login
SupportedPAMServices=lightdm, login

# 密码认证开关(默认开启)
[Password]
Enable=true
LoginEnable=true
UnlockEnable=true
EmpowermentEnable=true

[Face]
#本地人脸识别相似度阈值(0~1,越大越严格;参考基准:同人约0.885,异人约0.179)
Threshold=0.6
#识别摄像头:索引(纯数字)或设备路径,默认 0
Camera=0
EmpowermentEnable=true
Enable=true
LoginEnable=true
UnlockEnable=true

[FingerPrint]
EmpowermentEnable=true
Enable=true
LoginEnable=true
UnlockEnable=true

[FingerVein]
EmpowermentEnable=true
Enable=true
LoginEnable=true
UnlockEnable=true

[Iris]
EmpowermentEnable=true
Enable=true
LoginEnable=true
UnlockEnable=true

[Ukey]
EmpowermentEnable=true
Enable=true
LoginEnable=true
UnlockEnable=true

[SoftFace]
EmpowermentEnable=true
Enable=false
LoginEnable=true
UnlockEnable=true

[SoftCode]
EmpowermentEnable=true
Enable=false
LoginEnable=true
UnlockEnable=true

[SoftCodeNoCamera]
EmpowermentEnable=true
Enable=false
LoginEnable=true
UnlockEnable=true